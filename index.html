<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVA // Community Appeal Portal</title>
<style>
:root {
  --primary: #00f3ff;
  --secondary: #0077aa;
  --danger: #ff3344;
  --success: #00ff66;
  --bg: #030508;
  --card-bg: rgba(6, 10, 18, 0.96);
  --silver: #d0d8e0;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Courier New', Courier, monospace;
}

body {
  background: var(--bg);
  color: var(--silver);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

.ambient-grid {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background:
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.ambient-crest {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 500px;
  height: 500px;
  background: url("https://images.squarespace-cdn.com/content/68f57e5f04c32251ed666050/06b4757a-f350-4a81-af5f-019f044cc200/OVA.png?content-type=image%2Fpng") center/contain no-repeat;
  opacity: 0.08;
  filter: blur(10px) drop-shadow(0 0 40px var(--primary));
  pointer-events: none;
  z-index: 0;
}

.portal-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 540px;
  background: var(--card-bg);
  border: 2px solid var(--primary);
  box-shadow: 0 0 35px rgba(0, 0, 0, 0.95), 0 0 15px rgba(0, 243, 255, 0.2);
  padding: 30px;
  display: flex;
  flex-direction: column;
}

.header-group {
  text-align: center;
  border-bottom: 2px solid var(--primary);
  padding-bottom: 15px;
  margin-bottom: 20px;
}

.header-badge {
  font-size: 0.7rem;
  color: var(--primary);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.header-title {
  font-size: 1.3rem;
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

label {
  font-size: 0.75rem;
  color: var(--primary);
  font-weight: bold;
  letter-spacing: 1px;
}

input, textarea {
  background: #000;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  padding: 10px;
  font-family: inherit;
  font-size: 0.85rem;
  border-radius: 2px;
  outline: none;
  transition: border-color 0.2s;
}

input:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
}

textarea {
  height: 110px;
  resize: vertical;
}

.transmit-btn {
  background: var(--primary);
  color: #000;
  border: 1px solid var(--primary);
  padding: 12px;
  font-family: inherit;
  font-weight: 900;
  font-size: 0.85rem;
  letter-spacing: 1.5px;
  cursor: pointer;
  margin-top: 6px;
  transition: all 0.2s ease;
}

.transmit-btn:hover:not(:disabled) {
  background: #fff;
  box-shadow: 0 0 20px var(--primary);
}

.transmit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.status-box {
  margin-top: 15px;
  padding: 12px;
  font-size: 0.78rem;
  text-align: center;
  display: none;
  border: 1px solid;
}

.status-box.success {
  display: block;
  border-color: var(--success);
  color: var(--success);
  background: rgba(0, 255, 102, 0.1);
}

.status-box.error {
  display: block;
  border-color: var(--danger);
  color: var(--danger);
  background: rgba(255, 51, 68, 0.1);
}
</style>
</head>
<body>

<div class="ambient-grid"></div>
<div class="ambient-crest"></div>

<div class="portal-card">
  <div class="header-group">
    <div class="header-badge">// SECURE COMM PROTOCOL</div>
    <div class="header-title">COMMUNITY APPEAL SUBMISSION</div>
  </div>

  <form id="appeal-form">
    <div class="form-group">
      <label for="twitch-user">TWITCH USERNAME *</label>
      <input type="text" id="twitch-user" placeholder="e.g. your_twitch_name" required>
    </div>

    <div class="form-group">
      <label for="contact-info">CONTACT IDENTIFIER (DISCORD OR EMAIL) *</label>
      <input type="text" id="contact-info" placeholder="e.g. discord_handle or email@domain.com" required>
    </div>

    <div class="form-group">
      <label for="case-notes">CASE SUBMISSION / EXPLANATION *</label>
      <textarea id="case-notes" placeholder="Explain the context of your ban and why it should be reconsidered by the OVA stream team..." required></textarea>
    </div>

    <button type="submit" class="transmit-btn" id="submit-btn">TRANSMIT APPEAL</button>
  </form>

  <div class="status-box" id="status-display"></div>
</div>

<script>
const SUPABASE_URL = "https://iwomdpudprtftmkapxzl.supabase.co";
const SUPABASE_KEY = "sb_publishable_JHnWep_kWjjL6iwE0zyUOw_zX1f_A11";

const form = document.getElementById('appeal-form');
const submitBtn = document.getElementById('submit-btn');
const statusDisplay = document.getElementById('status-display');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = "TRANSMITTING ENCRYPTED RECORD...";
  statusDisplay.className = 'status-box';
  statusDisplay.style.display = 'none';

  const username = document.getElementById('twitch-user').value.trim().toLowerCase();
  const contact = document.getElementById('contact-info').value.trim();
  const notes = document.getElementById('case-notes').value.trim();

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/appeals`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        username: username,
        contact_info: contact,
        case_notes: notes,
        status: 'pending',
        yes_votes: 0
      })
    });

    if (res.ok) {
      statusDisplay.className = 'status-box success';
      statusDisplay.innerHTML = `// APPEAL TRANSMITTED<br>Your submission has been logged into the OVA database for stream team deliberation.`;
      form.reset();
    } else {
      throw new Error("Transmission rejected by server.");
    }
  } catch (err) {
    statusDisplay.className = 'status-box error';
    statusDisplay.innerHTML = `// ERROR ENCOUNTERED<br>Could not record appeal. Please retry shortly.`;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "TRANSMIT APPEAL";
  }
});
</script>
</body>
</html>
