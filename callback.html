<!DOCTYPE html>
<html>
<head><title>Authorizing OVA Session...</title></head>
<body style="background:#030508;color:#00f3ff;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;">
  <div style="font-weight:bold;letter-spacing:1px;">AUTHENTICATING OVA SESSION...</div>
  <div id="status" style="color:#888;font-size:12px;margin-top:8px;">Transmitting token to wheel...</div>
  <script>
    try {
      if (window.opener) {
        window.opener.postMessage({ 
          type: 'OVA_AUTH_CALLBACK', 
          url: window.location.href 
        }, '*');
        document.getElementById('status').innerText = 'Handshake complete! Closing window...';
        setTimeout(() => window.close(), 600);
      } else {
        document.getElementById('status').innerText = 'Error: Parent window not detected.';
      }
    } catch (err) {
      document.getElementById('status').innerText = 'Transmission error: ' + err.message;
    }
  </script>
</body>
</html>
